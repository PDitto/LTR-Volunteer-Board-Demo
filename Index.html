<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>TXM Rebuild Volunteer Board</title>
<style>
:root{--navy:#17324d;--ink:#1d2733;--mute:#5d6b7a;--line:#d9dee4;--bg:#f5f3ee;--card:#fff;--accent:#b8501a;--ok:#1f7a4d;--okbg:#e4f3ea;--warn:#8a5a00;--warnbg:#fdf1d3;--bad:#a12a2a;--badbg:#fbe5e3;--info:#1d4f8f;--infobg:#e3edf9}
*{box-sizing:border-box}
body{margin:0;font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);background:var(--bg)}
header{background:var(--navy);color:#fff;padding:14px 18px 0}
.wrap{max-width:1080px;margin:0 auto}
h1{font-size:20px;margin:0 0 2px;letter-spacing:.2px}
.sub{color:#c6d2de;font-size:13px;margin-bottom:10px}
nav{display:flex;gap:4px;flex-wrap:wrap}
nav button{background:transparent;border:0;color:#c6d2de;font:inherit;font-weight:600;padding:9px 14px;border-radius:8px 8px 0 0;cursor:pointer}
nav button.on{background:var(--bg);color:var(--navy)}
main{padding:18px}
h2{font-size:19px;margin:4px 0 10px;color:var(--navy)}
h3{font-size:16px;margin:0 0 4px}
p{margin:0 0 10px}
.mute{color:var(--mute);font-size:14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:12px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:12px}
.grid .card{margin:0;display:flex;flex-direction:column}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.sp{justify-content:space-between}
.pill{display:inline-block;font-size:12px;font-weight:700;padding:2px 9px;border-radius:99px;background:#e9edf1;color:#3b4856;white-space:nowrap}
.pill.ok{background:var(--okbg);color:var(--ok)}.pill.warn{background:var(--warnbg);color:var(--warn)}.pill.bad{background:var(--badbg);color:var(--bad)}.pill.info{background:var(--infobg);color:var(--info)}
.bar{height:8px;background:#e6e9ed;border-radius:99px;overflow:hidden;margin:8px 0 4px}
.bar i{display:block;height:100%;background:var(--ok)}
.facts{list-style:none;margin:8px 0;padding:0;font-size:14px}
.facts li{padding:2px 0}
.facts b{font-weight:600}
button.b,a.b{font:inherit;font-weight:600;border:1px solid var(--navy);background:var(--navy);color:#fff;border-radius:8px;padding:8px 14px;cursor:pointer;text-decoration:none;display:inline-block}
button.b.alt{background:#fff;color:var(--navy)}
button.b.go{background:var(--accent);border-color:var(--accent)}
button.b.sm{padding:4px 10px;font-size:13px}
button.b.danger{background:#fff;color:var(--bad);border-color:var(--bad)}
button.b:disabled{opacity:.5;cursor:default}
button.link{background:none;border:0;color:var(--info);font:inherit;cursor:pointer;padding:0;text-decoration:underline}
label{display:block;font-size:13px;font-weight:600;color:#3b4856;margin-bottom:8px}
input[type=text],input[type=email],input[type=tel],input[type=number],input[type=date],input[type=password],select,textarea{display:block;width:100%;font:inherit;padding:7px 9px;border:1px solid #b9c2cc;border-radius:7px;background:#fff;margin-top:3px}
textarea{min-height:70px}
.f2{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:0 12px}
.chk{display:flex;gap:6px;align-items:center;font-weight:500}
.tblwrap{overflow-x:auto;margin:8px 0}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:left;font-size:12px;text-transform:uppercase;letter-spacing:.4px;color:var(--mute);padding:6px 8px;border-bottom:2px solid var(--line);white-space:nowrap}
td{padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:middle}
td input[type=text],td input[type=email],td input[type=number]{min-width:120px;margin:0}
td.c{text-align:center}
.note{border-left:4px solid var(--info);background:var(--infobg);padding:9px 12px;border-radius:6px;font-size:14px;margin:0 0 12px}
.note.warn{border-color:#d19a1c;background:var(--warnbg)}.note.bad{border-color:var(--bad);background:var(--badbg)}.note.ok{border-color:var(--ok);background:var(--okbg)}
.tray{position:sticky;bottom:0;background:var(--navy);color:#fff;border-radius:12px 12px 0 0;padding:12px 16px;margin-top:14px}
pre{white-space:pre-wrap;background:#f3f5f7;border:1px solid var(--line);border-radius:8px;padding:10px;font-size:13px;margin:8px 0;overflow-x:auto}
#toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:#1d2733;color:#fff;padding:10px 16px;border-radius:8px;display:none;max-width:90vw;z-index:9;font-size:14px}
#toast.bad{background:var(--bad)}
.demo{background:#fff4d6;border-bottom:1px solid #e6c768;padding:8px 18px;font-size:14px}
.demo input{display:inline-block;width:auto;margin:0 6px}
.tabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.tabs button{font:inherit;font-weight:600;border:1px solid var(--line);background:#fff;border-radius:99px;padding:6px 14px;cursor:pointer;color:var(--navy)}
.tabs button.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.steps{display:flex;gap:6px;flex-wrap:wrap;font-size:13px;margin:6px 0}
.steps span{padding:2px 8px;border-radius:6px;background:#eef1f4}
.steps span.y{background:var(--okbg);color:var(--ok)}.steps span.n{background:var(--warnbg);color:var(--warn)}.steps span.x{background:var(--badbg);color:var(--bad)}
@media (max-width:560px){main{padding:12px}.card{padding:12px}}
</style>
</head>
<body>
<div id="demobar"></div>
<header><div class="wrap">
  <h1>TXM Rebuild Volunteer Board</h1>
  <div class="sub">Texans on Mission Disaster Relief · Long-Term Recovery</div>
  <nav id="nav"></nav>
</div></header>
<main><div class="wrap" id="app"><p class="mute">Loading…</p></div></main>
<div id="toast" role="status"></div>
<!--DEMO-->
<script>
var BOOT = /*BOOT*/{};
var DEMO = !(window.google && google.script && google.script.run);
var st = { view: 'needs', board: null, picks: {}, filt: { q: '', month: '', lodging: false }, org: { name: '', pocName: '', pocEmail: '', pocPhone: '' },
  token: BOOT.t || '', poc: null, edit: {}, auth: null, staff: null, stab: 'requests', open: {}, form: null, busy: false, done: null, linkEmail: '', login: { email: '', code: '' }, clr: { name: '', email: '', expires: '', bulk: '' }, notes: {}, hc: {} };
try { if (!st.token) st.token = localStorage.getItem('ltr_t') || ''; } catch (e) {}
if (st.token) st.view = 'mine';

function esc(s) { return String(s === null || s === undefined ? '' : s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
var MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
function nice(iso) { var p = String(iso || '').split('-'); return p.length < 3 ? '' : MON[+p[1] - 1] + ' ' + (+p[2]) + ', ' + p[0]; }
function range(a, b) { var x = a.split('-'), y = b.split('-'); if (a === b) return nice(a); return x[1] === y[1] ? MON[+x[1] - 1] + ' ' + (+x[2]) + '–' + (+y[2]) + ', ' + x[0] : MON[+x[1] - 1] + ' ' + (+x[2]) + ' – ' + nice(b); }
function addDays(iso, n) { var p = iso.split('-'); return new Date(Date.UTC(+p[0], +p[1] - 1, +p[2]) + n * 864e5).toISOString().slice(0, 10); }
function toast(msg, bad) { var t = document.getElementById('toast'); t.textContent = msg; t.className = bad ? 'bad' : ''; t.style.display = 'block'; clearTimeout(toast.t); toast.t = setTimeout(function () { t.style.display = 'none'; }, bad ? 6500 : 3200); }
function setPath(path, val) { var p = path.split('.'), o = st; for (var i = 0; i < p.length - 1; i++) { if (o[p[i]] === undefined) o[p[i]] = {}; o = o[p[i]]; } o[p[p.length - 1]] = val; }

function call(action, payload) {
  return new Promise(function (res, rej) {
    if (DEMO) {
      setTimeout(function () {
        try { res(JSON.parse(JSON.stringify(window.demoApp.api(action, payload)))); if (window.demoRefresh) window.demoRefresh(); }
        catch (e) { if (!e.user) console.error(e); rej(e.user ? e.message : 'Something went wrong.'); }
      }, 80);
    } else {
      google.script.run.withSuccessHandler(function (s) { var r = JSON.parse(s); if (r.ok) res(r.data); else rej(r.error); })
        .withFailureHandler(function () { rej('Could not reach the server. Try again.'); }).api(action, payload);
    }
  });
}
function run(action, payload, okMsg, then) {
  if (st.busy) return; st.busy = true; document.body.style.cursor = 'progress';
  call(action, payload).then(function (d) { st.busy = false; document.body.style.cursor = ''; if (okMsg) toast(okMsg); then && then(d); render(); })
    .catch(function (m) { st.busy = false; document.body.style.cursor = ''; toast(m, true); });
}
function A(extra) { var o = { email: st.auth.email, code: st.auth.code }; for (var k in extra) o[k] = extra[k]; return o; }

/* ---------- loading ---------- */
function loadBoard() { call('board').then(function (d) { st.board = d; render(); }).catch(function (m) { toast(m, true); }); }
function loadPoc() {
  if (!st.token) return;
  call('poc.home', { token: st.token }).then(function (d) { setPoc(d); try { localStorage.setItem('ltr_t', st.token); } catch (e) {} render(); })
    .catch(function (m) { st.token = ''; st.poc = null; try { localStorage.removeItem('ltr_t'); } catch (e) {} toast(m, true); render(); });
}
function setPoc(d) {
  st.poc = d; st.edit = {}; st.org = { name: d.org.name, pocName: d.org.pocName, pocEmail: d.org.pocEmail, pocPhone: d.org.pocPhone };
  d.commitments.forEach(function (c) { st.edit[c.id] = { people: c.people.map(function (p) { return Object.assign({}, p); }), arrival: c.arrival, vehicles: c.vehicles, tools: c.tools, mealsNote: c.mealsNote, change: '', confirmCancel: false }; });
}
function setStaff(d) {
  st.staff = d;
  d.requests.forEach(function (r) { r.commitments.forEach(function (c) { st.edit[c.id] = { people: c.people.map(function (p) { return Object.assign({}, p); }) }; if (st.hc[c.id] === undefined) st.hc[c.id] = c.headcount; }); });
}

/* ---------- shared pieces ---------- */
function statusPill(s) {
  var m = { pending: ['Waiting for approval', 'warn'], approved: ['Confirmed', 'ok'], waitlist: ['Waitlist', 'info'], declined: ['Not confirmed', 'bad'], cancelled: ['Cancelled', ''], posted: ['Posted', 'ok'], closed: ['Closed', ''] };
  var x = m[s] || [s, '']; return '<span class="pill ' + x[1] + '">' + esc(x[0]) + '</span>';
}
function bedBadge(p) {
  if (p.bed === 'txm') return '<span class="pill ok">TXM bed: check cleared</span>';
  if (p.bed === 'own') return '<span class="pill bad">' + (p.note ? 'Check expires before trip ends' : 'No cleared check') + ': needs own lodging</span>';
  return p.cleared ? '<span class="pill">Own lodging · check on file</span>' : '<span class="pill">Own lodging</span>';
}
function readySteps(rd) {
  function s(ok, t, cls) { return '<span class="' + (ok ? 'y' : (cls || 'n')) + '">' + (ok ? '✓ ' : '') + esc(t) + '</span>'; }
  return '<div class="steps">' + s(rd.roster >= rd.headcount, 'Roster ' + rd.roster + '/' + rd.headcount) + s(rd.roster > 0 && rd.waivers >= rd.roster, 'Waivers ' + rd.waivers + '/' + rd.roster) +
    (rd.lodgingWanted ? s(rd.ownLodging === 0, 'TXM beds ' + rd.beds + '/' + rd.lodgingWanted + ' cleared', 'x') : '<span>No TXM lodging requested</span>') + s(rd.details, 'Arrival details') + '</div>';
}
function rosterTable(cid, max, editable, showHours) {
  var e = st.edit[cid], rows = e.people.map(function (p, i) {
    var k = 'edit.' + cid + '.people.' + i + '.';
    if (!editable) return '<tr><td>' + esc(p.name) + (p.minor ? ' <span class="pill">minor</span>' : '') + '</td><td>' + esc(p.email) + '</td><td class="c">' + (p.waiver ? '✓' : '<span class="pill warn">missing</span>') + '</td><td>' + bedBadge(p) + '</td><td>' + esc(p.diet) + '</td>' +
      (showHours ? '<td><input type="number" min="0" step="0.5" style="width:80px;min-width:0" value="' + esc(p.hours || '') + '" data-hours="' + esc(p.id) + '" aria-label="Hours for ' + esc(p.name) + '"></td>' : '') + '</tr>';
    return '<tr><td><input type="text" data-k="' + k + 'name" value="' + esc(p.name) + '" aria-label="Name"></td><td><input type="email" data-k="' + k + 'email" value="' + esc(p.email) + '" aria-label="Email"></td>' +
      '<td class="c"><input type="checkbox" data-k="' + k + 'minor"' + (p.minor ? ' checked' : '') + ' aria-label="Minor"></td><td class="c"><input type="checkbox" data-k="' + k + 'waiver"' + (p.waiver ? ' checked' : '') + ' aria-label="Waiver signed"></td>' +
      '<td class="c"><input type="checkbox" data-k="' + k + 'lodging"' + (p.lodging ? ' checked' : '') + ' aria-label="Needs TXM lodging"></td><td>' + (p.id ? bedBadge(p) : '<span class="mute">Save to check</span>') + '</td>' +
      '<td><input type="text" data-k="' + k + 'diet" value="' + esc(p.diet) + '" aria-label="Dietary needs"></td><td><button class="link" data-act="rmPerson" data-cid="' + cid + '" data-i="' + i + '">Remove</button></td></tr>';
  }).join('');
  var head = editable ? '<th>Name</th><th>Email</th><th>Minor</th><th>Waiver signed</th><th>Needs TXM lodging</th><th>Housing</th><th>Dietary needs</th><th></th>'
    : '<th>Name</th><th>Email</th><th>Waiver</th><th>Housing</th><th>Dietary needs</th>' + (showHours ? '<th>Hours</th>' : '');
  return '<div class="tblwrap"><table><thead><tr>' + head + '</tr></thead><tbody>' + (rows || '<tr><td colspan="8" class="mute">No names yet.</td></tr>') + '</tbody></table></div>' +
    (editable ? '<button class="b alt sm" data-act="addPerson" data-cid="' + cid + '"' + (e.people.length >= max ? ' disabled' : '') + '>+ Add person</button> <span class="mute">' + e.people.length + ' of ' + max + '</span>' : '');
}

/* ---------- Open needs ---------- */
function vNeeds() {
  if (!st.board) return '<p class="mute">Loading open needs…</p>';
  if (st.done) return vDone();
  var f = st.filt, months = {}, list = st.board.requests;
  list.forEach(function (r) { months[r.startDate.slice(0, 7)] = 1; });
  var shown = list.filter(function (r) {
    if (f.month && r.startDate.slice(0, 7) !== f.month) return false;
    if (f.lodging && !r.lodgingBeds) return false;
    var q = f.q.toLowerCase(); return !q || (r.project + ' ' + r.city + ' ' + r.county + ' ' + r.skills).toLowerCase().indexOf(q) >= 0;
  });
  var h = '<h2>Open volunteer needs</h2><p class="mute">Pick one or more projects, tell us how many people you can bring, and send your sign-up. You can sign up for several projects on different dates. A sign-up is confirmed when the Rebuild Project Manager approves it.</p>' +
    '<div class="card"><div class="f2"><label>Search<input type="text" data-k="filt.q" data-live="1" value="' + esc(f.q) + '" placeholder="City, county, skill"></label>' +
    '<label>Month<select data-k="filt.month" data-live="1"><option value="">All months</option>' + Object.keys(months).sort().map(function (m) { return '<option value="' + m + '"' + (f.month === m ? ' selected' : '') + '>' + MON[+m.slice(5) - 1] + ' ' + m.slice(0, 4) + '</option>'; }).join('') + '</select></label>' +
    '<label class="chk" style="align-self:end;padding-bottom:10px"><input type="checkbox" data-k="filt.lodging" data-live="1"' + (f.lodging ? ' checked' : '') + '> TXM lodging available</label></div></div>';
  if (!shown.length) h += '<div class="card"><p>No open needs match right now. Check back soon.</p></div>';
  h += '<div class="grid">' + shown.map(function (r) {
    var pk = st.picks[r.id], full = r.remaining <= 0, pct = Math.min(100, Math.round(r.filled / r.need * 100));
    return '<div class="card"><div class="row sp"><h3>' + esc(r.project) + '</h3>' + (full ? '<span class="pill info">Full · waitlist open</span>' : '<span class="pill ok">' + r.remaining + ' spots open</span>') + '</div>' +
      '<div class="mute">' + esc(r.city) + ' · ' + esc(r.county) + ' County</div>' +
      '<div style="font-weight:600;margin-top:6px">' + range(r.startDate, r.endDate) + ' · ' + r.days + ' day' + (r.days > 1 ? 's' : '') + '</div>' +
      '<div class="bar"><i style="width:' + pct + '%"></i></div><div class="mute">' + r.filled + ' of ' + r.need + ' volunteers confirmed' + (r.waitlist ? ' · ' + r.waitlist + ' on waitlist' : '') + '</div>' +
      '<ul class="facts">' + (r.skills ? '<li><b>Skills:</b> ' + esc(r.skills) + '</li>' : '') +
      '<li><b>Lodging:</b> ' + (r.lodgingBeds ? 'TXM housing, ' + r.lodgingBeds + ' beds. Background check required.' : 'Not provided. Bring your own.') + '</li>' +
      (r.meals ? '<li><b>Meals:</b> ' + esc(r.meals) + '</li>' : '') + (r.minAge ? '<li><b>Minimum age:</b> ' + r.minAge + '</li>' : '') + (r.notes ? '<li>' + esc(r.notes) + '</li>' : '') + '</ul>' +
      '<div style="margin-top:auto">' + (pk ? '<div class="f2"><label>People you will bring<input type="number" min="1" data-k="picks.' + r.id + '.headcount" value="' + esc(pk.headcount) + '"></label>' +
        (r.lodgingBeds ? '<label>How many need TXM lodging<input type="number" min="0" data-k="picks.' + r.id + '.lodgingCount" value="' + esc(pk.lodgingCount) + '"></label>' : '') + '</div>' +
        '<button class="b alt sm" data-act="unpick" data-id="' + r.id + '">Remove from my sign-up</button>'
        : '<button class="b' + (full ? ' alt' : '') + '" data-act="pick" data-id="' + r.id + '">' + (full ? 'Join the waitlist' : 'Add to my sign-up') + '</button>') + '</div></div>';
  }).join('') + '</div>';
  var ids = Object.keys(st.picks);
  if (ids.length) {
    var o = st.org;
    h += '<div class="card" id="signup" style="margin-top:14px;border-color:var(--navy)"><h2>Send your sign-up (' + ids.length + ' project' + (ids.length > 1 ? 's' : '') + ')</h2>' +
      '<div class="f2"><label>Church or organization<input type="text" data-k="org.name" value="' + esc(o.name) + '"></label><label>Contact person<input type="text" data-k="org.pocName" value="' + esc(o.pocName) + '"></label>' +
      '<label>Contact email<input type="email" data-k="org.pocEmail" value="' + esc(o.pocEmail) + '"></label><label>Contact phone<input type="tel" data-k="org.pocPhone" value="' + esc(o.pocPhone) + '"></label></div>' +
      '<div class="note">Roster and headcount are final ' + st.board.cutoff + ' days before arrival. Only people with a completed background check can stay in TXM housing. The site address is sent ' + st.board.handoff + ' days before arrival.</div>' +
      '<button class="b go" data-act="signup">Send sign-up</button></div>';
  }
  return h;
}
function vDone() {
  var d = st.done;
  return '<div class="card"><h2>Sign-up received</h2><div class="tblwrap"><table><tbody>' + d.results.map(function (r) { return '<tr><td>' + esc(r.project) + '</td><td>' + nice(r.startDate) + '</td><td>' + statusPill(r.status) + '</td></tr>'; }).join('') + '</tbody></table></div>' +
    '<p>We emailed a private link to <b>' + esc(d.emailed) + '</b>. Use it to enter your roster and manage your sign-ups. The Rebuild Project Manager will review each sign-up and email you.</p>' +
    '<div class="row">' + (st.token ? '<button class="b" data-act="go" data-v="mine">Go to my sign-ups</button>' : '') + '<button class="b alt" data-act="doneOk">Back to open needs</button></div></div>';
}

/* ---------- My sign-ups ---------- */
function vMine() {
  if (!st.token) return '<h2>My sign-ups</h2><div class="card"><p>Each church gets a private link by email when it signs up. Open that link to manage your rosters.</p>' +
    '<label>Lost the link? Enter the contact email and we will send it again.<input type="email" data-k="linkEmail" value="' + esc(st.linkEmail) + '"></label><button class="b" data-act="sendLink">Email me my link</button>' +
    (DEMO ? '<p class="mute" style="margin-top:12px">Demo: <button class="link" data-act="demoPoc">open the sample church</button></p>' : '') + '</div>';
  if (!st.poc) return '<p class="mute">Loading your sign-ups…</p>';
  var d = st.poc, h = '<div class="row sp"><h2>' + esc(d.org.name) + '</h2><button class="link" data-act="pocOut">Not you? Sign out</button></div><p class="mute">Contact: ' + esc(d.org.pocName) + ' · ' + esc(d.org.pocEmail) + ' · ' + esc(d.org.pocPhone) + '</p>';
  if (!d.commitments.length) h += '<div class="card">No sign-ups yet. <button class="link" data-act="go" data-v="needs">See open needs</button></div>';
  d.commitments.forEach(function (c) {
    var r = c.request, e = st.edit[c.id], live = /^(pending|approved|waitlist)$/.test(c.status), editable = live && !c.locked;
    h += '<div class="card"><div class="row sp"><h3>' + esc(r.project) + '</h3>' + statusPill(c.status) + '</div>' +
      '<div class="mute">' + esc(r.city) + ' · ' + esc(r.county) + ' County</div><div style="font-weight:600;margin:6px 0">' + range(r.startDate, r.endDate) + ' · ' + c.headcount + ' people</div>';
    if (!live) { h += '</div>'; return; }
    if (c.status === 'waitlist') h += '<div class="note">You are on the waitlist. We will contact you if a spot opens.</div>';
    if (c.status === 'pending') h += '<div class="note warn">Waiting for approval. You can start your roster now.</div>';
    h += c.locked ? '<div class="note bad"><b>Roster is final.</b> We are inside ' + d.cutoff + ' days of arrival. To report a change, use "Request a change" below.</div>'
      : '<div class="note">Roster and headcount are final on <b>' + nice(c.cutoffDate) + '</b> (' + (r.daysOut - d.cutoff) + ' days from now).</div>';

  else if (a === 'delClr') run('staff.clearanceDelete', A({ id: id }), 'Removed.', setStaff);
  else if (a === 'runDaily') run('staff.runDaily', A(), "Today's check ran.", setStaff);
  else if (a === 'copy') { var t = document.getElementById(id).textContent; try { navigator.clipboard.writeText(t).then(function () { toast('Copied.'); }, function () { toast('Select the text and copy it.', true); }); } catch (e) { toast('Select the text and copy it.', true); } }
  else if (a === 'demoStaff') { st.auth = { email: el.getAttribute('data-e'), code: el.getAttribute('data-c') }; run('staff.home', A(), '', setStaff); }
  else if (a === 'demoPoc') { st.token = window.demoToken; loadPoc(); }
  else if (window.demoAct) window.demoAct(a, el);
});
function start() { render(); loadBoard(); if (st.token) loadPoc(); }
if (DEMO && !window.demoApp) document.getElementById('app').innerHTML = '<p>This page needs to run inside Google Apps Script.</p>'; else start();
</script>
